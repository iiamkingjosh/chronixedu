name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        # Fail only on CRITICAL. Remaining HIGH issues (next 14→15, @typescript-eslint 6→8)
        # require major version upgrades tracked in the ops roadmap.
        #
        # Not a bare `npm audit --audit-level=critical`: that had no way to name an
        # accepted advisory, so two criticals on next@14.2.35 (published 25 Aug 2026) kept
        # this step red on every commit, ahead of lint and every test job, for five weeks.
        # scripts/audit-gate.js fails on any critical advisory NOT in
        # scripts/audit-allowlist.json, and on an allowlisted one that is stale, past its
        # date, or whose stated precondition no longer holds. It also fails if npm audit
        # produced no report.
        run: node scripts/audit-gate.js

      - name: Lint (web + api)
        run: npm run lint

      - name: Type check — web
        run: npx tsc --project apps/web/tsconfig.json --noEmit

      - name: Type check — api
        run: npx tsc --project apps/api/tsconfig.json --noEmit

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: lint-and-typecheck

    env:
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Deliberately scoped to apps/api/src/__tests__ only — this suite mocks
      # pg/Supabase/SendGrid entirely, so it needs no real credentials and never
      # touches a live database. It deploy-gates Railway via "Wait for CI checks".
      #
      # apps/api/tests/** is a SEPARATE integration suite that runs against the
      # real production Supabase DB using hardcoded fixture UUIDs (e.g. a fixed
      # school_id). It is NOT run here on purpose: gating deploys on it meant
      # Railway skipped real deployments whenever that fixture data drifted in
      # production (manual cleanup, the db-wipe script, concurrent test runs,
      # etc.) — failures unrelated to the code being shipped. Run it manually
      # with `npm run test:isolation` against a disposable/staging DB, never
      # automatically against production.
      - name: Run unit tests
        run: npm run test:unit

  # Railway auto-deploys via GitHub integration — no webhook step needed.
  # Enable "Wait for CI checks" in Railway → service → Settings → Source
  # so Railway only deploys after this workflow passes.

  db-tests:
    # AUDIT 2026-09 — Architecture Guide §2.2 rule 4: tenant isolation must run
    # in CI on every push. This job rebuilds a throwaway Postgres from
    # /migrations (so it also proves the migrations still build the schema the
    # code expects), then runs:
    #   • test:db — result workflow, score integrity, RLS coverage, cross-tenant
    #     API refusal, cron locking (apps/api/src/__db_tests__)
    #   • test:integration:local — the existing apps/api/tests suite, minus the
    #     four files that need a live Supabase Auth project.
    # Nothing here can reach production: both setups refuse non-local hosts.
    name: Database & Isolation Tests
    runs-on: ubuntu-latest
    needs: lint-and-typecheck

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: chronixedu_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/chronixedu_test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/chronixedu_test
      JWT_SECRET: ci-only-jwt-secret-not-used-anywhere-else
      ROOT_ADMIN_EMAIL: root@chronixedu-ci.test
      SUPABASE_URL: http://127.0.0.1:54321
      SUPABASE_PUBLISHABLE_KEY: ci-placeholder
      SUPABASE_SERVICE_ROLE_KEY: ci-placeholder

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        env:
          PUPPETEER_SKIP_DOWNLOAD: '1'

      # A throwaway database needs no crash safety, and the seed pays for it heavily:
      # beforeEach(seed) TRUNCATEs ~45 tables, and TRUNCATE gives every one a new file that
      # must be flushed (IO:DataFileImmediateSync). Measured 28 Sep 2026: single TRUNCATEs
      # of up to 6.9s, against the seed's 20s statement_timeout, and the whole suite at
      # 225–242s; with these three off, 99s and no I/O wait over a second. Service
      # containers take no server flags, so this is ALTER SYSTEM + reload (all three are
      # reloadable without a restart). The last line FAILS the step if fsync is still on,
      # rather than reporting it: a setting that silently did not apply is doctrine 9.
      - name: Disable durability on the throwaway test database
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d chronixedu_test -v ON_ERROR_STOP=1 -c "ALTER SYSTEM SET fsync = off"
          psql -h localhost -U postgres -d chronixedu_test -v ON_ERROR_STOP=1 -c "ALTER SYSTEM SET synchronous_commit = off"
          psql -h localhost -U postgres -d chronixedu_test -v ON_ERROR_STOP=1 -c "ALTER SYSTEM SET full_page_writes = off"
          psql -h localhost -U postgres -d chronixedu_test -v ON_ERROR_STOP=1 -c "SELECT pg_reload_conf()"
          sleep 1
          test "$(psql -h localhost -U postgres -d chronixedu_test -Atc "SELECT current_setting('fsync')")" = off

      - name: DB regression + tenant isolation suite
        run: npm run test:db

      # The integration suite's Auth-dependent tests (bulk imports, onboarding's principal step)
      # need a real Supabase Auth. Supabase's local stack gives one, at the address SUPABASE_URL
      # already names, with its own fixed local keys. Only the database, Auth and the gateway run.
      # REQUIRE_TEST_AUTH makes the suite FAIL if Auth is unusable, rather than skip: "7 skipped"
      # on every run reported nothing and guarded nothing (doctrine 9; decided 4 Oct 2026).
      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.116.0

      - name: Start Supabase Auth (local stack)
        run: |
          mkdir -p "$RUNNER_TEMP/supabase-auth" && cd "$RUNNER_TEMP/supabase-auth"
          supabase init --force
          supabase start -x realtime,storage-api,imgproxy,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
          eval "$(supabase status -o env)"
          test "$API_URL" = "$SUPABASE_URL"
          echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY" >> "$GITHUB_ENV"
          echo "SUPABASE_PUBLISHABLE_KEY=$ANON_KEY" >> "$GITHUB_ENV"

      - name: Integration suite (local DB, local Supabase Auth)
        run: npm run test:integration:local -- --forceExit
        env:
          REQUIRE_TEST_AUTH: '1'
